# 默认配置示例；运行时文件位于 config/goety_supreme/。
# 修改运行时配置后重启游戏。强化开关仅控制是否接受新强化，不删除已获得的强化。

[mutant_enderman_servant]
# 最大生命值，与 Mutant Monsters 原版突变末影人一致为 200。
max_health = 200.0
# 基础攻击伤害（爪击在原版还会按出手臂追加 1~3 点）。
attack_damage = 7.0
# 移动速度，原版突变末影人为 0.3。
movement_speed = 0.3
# 击退抗性，原版突变末影人为 1.0（完全免疫击退）。
knockback_resistance = 1.0
# 护甲值。
armor = 0.0
# 护甲韧性值。
armor_toughness = 0.0
# 索敌范围，原版突变末影人为 96。
follow_range = 96.0
# 是否启用近身爪击（MELEE 动画，第 3 刻结算 4 格扇形伤害并击飞）。
claw_enabled = true
# 爪击触发距离（格）。
claw_reach = 4
# 是否启用传送突袭（TELEPORT 动画：闪现到目标附近再近战）。
teleport_enabled = true
# 目标距离至少多少格才会考虑传送拉近。
teleport_min_distance = 8
# 目标距离超过多少格就不再追（走普通寻路）。
teleport_max_distance = 32
# 两次传送突袭之间的最短间隔（秒）。
teleport_cooldown_seconds = 3
# 是否启用天坠砸击：第 18 刻把目标传送到高处，造成穿透伤害；起手附加缓慢和反胃。
telesmash_enabled = true
# 天坠砸击的最近触发距离（格）；默认允许近战触发。
telesmash_min_distance = 0
# 天坠砸击的最远触发距离（格）。
telesmash_max_distance = 40
# 天坠砸击对正中目标的伤害，原版为 6（穿透护盾的伤害类型）。
telesmash_damage = 6
# 两次天坠砸击之间的最短间隔（秒）。
telesmash_cooldown_seconds = 6
# 是否启用尖啸：第 40 刻范围穿透伤害和减益，后续持续震慑；淋雨时更容易触发。
scream_enabled = true
# 尖啸的范围伤害，原版为 4（穿透护盾的伤害类型）。
scream_damage = 4
# 尖啸的水平作用半径（格），原版 20。
scream_radius = 20
# 两次尖啸之间的最短间隔（秒）。
scream_cooldown_seconds = 20
# 尖啸是否附加原版减益：缓慢IV 6秒、50%中毒、75%虚弱、约67%饥饿、75%反胃。
scream_debuffs = true
# 是否启用投掷方块（THROW 动画，弹体走 Mutant Monsters 原版的 ThrowableBlock，观感与野生突变末影人完全一致）。
block_throw_enabled = true
# 是否允许仆从从世界里抓方块垫手（与原版一样需要 mobGriefing 开启；关闭后只有空手近战/传送/尖啸，不会破坏地形）。
block_grab_enabled = true
# 投掷方块的最近距离（格），贴身时改用近战。
block_throw_min_distance = 6
# 投掷方块的最远距离（格）。
block_throw_max_distance = 28
# 抓方块判定间隔（秒），原版节奏约 10~14 秒。
block_grab_cooldown_seconds = 12
# 碎块正中目标的伤害（原版按投掷者攻击伤害结算）。
rubble_damage = 10.0
# 碎块落点 2.5 格溅射伤害。
rubble_area_damage = 6.0
# 是否启用分身术：持块时也能发动，本体变为末魂形态，并召唤有主人归属的分身。技能结束、本体受击或死亡后清理，不产生野生分身。
clones_enabled = true
# 每次分身术召唤的末魂分身数量。
clone_count = 7
# 分身术结束到下次发动的最短间隔（秒）。
clone_cooldown_seconds = 30
# 死亡动画总时长，MM 原版为 280 刻，第 80 刻开始溶解。
death_fade_ticks = 280
# 虚空回响强化：伤害成功命中后有 40% 概率施加虚空之蚀 I，持续秒数。
void_touched_seconds = 5
# 技能恢复配置迁移版本，自动维护。
restored_skills_revision = 0

[mutant_enderman_servant.upgrades]
# 允许给予虚空碎片。
void_shard_enabled = true
# 虚空碎片增加的最大生命值。
void_shard_health = 25.0
# 瞬移召唤看守灵的概率。
watchling_teleport_chance = 0.5
# 瞬移召唤成功时一次召出的数量。
watchling_teleport_count = 2
# 分身术召唤看守灵的概率。
watchling_clone_chance = 1.0
# 分身术召唤看守灵的最少数量。
watchling_clone_min = 3
# 分身术召唤看守灵的最多数量。
watchling_clone_max = 5
# 每只突变末影人的看守灵上限，区块卸载不释放名额，0 禁止新召唤。
watchling_cap = 8
# 允许给予虚空回响。
void_echo_enabled = true
# 虚空回响增加的最大生命值。
void_echo_health = 50.0
# 虚空回响受到伤害的倍率。
void_echo_damage_multiplier = 0.85
# 虚空回响受击保护时长，20 刻为 1 秒0.75 秒 = 15。
void_echo_protection_ticks = 15
# 命中施加虚空之蚀的概率。
void_touched_chance = 0.40
# 允许给予虚空之眼。
void_eye_enabled = true
# 虚空之眼增加的最大生命值。
void_eye_health = 25.0
# 虚空之眼护佑等级。
void_eye_shielding_level = 2
# 虚空之眼重振等级。
void_eye_rallying_level = 1
# 虚空之眼偏转等级。
void_eye_deflective_level = 3
