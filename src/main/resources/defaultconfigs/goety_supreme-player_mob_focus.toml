# Goety Supreme 幻影聚晶配置。
# 游戏首次加载后会将本文件复制到 config/goety_supreme-player_mob_focus.toml。
# 修改 config 文件后重启游戏或服务器使配置生效。
# 仆从寿命与持久附魔加成不通过配置调整：初始 66 秒，每级持久固定 +100 秒。

[player_mob_focus]
	# 每次施法召唤消耗的灵魂能量。
	soul_cost = 40
	# 施法完成后的冷却时间，单位为 tick；默认 6 秒（120 tick）。
	cooldown = 120
	# 施法前摇时间，单位为 tick；默认 2 秒（40 tick）。
	cast_duration = 40
	# 同一主人同时存在的玩家生物幻影上限。
	summon_limit = 16
